td.num{font-variant-numeric:tabular-nums;color:var(--ink)}
.empty{padding:60px;text-align:center;color:var(--violet)}
.note{font-size:12px;color:var(--body);margin-top:10px}

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
let sortState={col:-1,dir:1};
function render(){
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.n===cur));
  const t=DATA[cur];
  document.getElementById('tname').textContent=cur;
  document.getElementById('tcnt').textContent=t.rows.length+' 行 · '+t.cols.length+' 列';
  let rows=t.rows.map(r=>r.slice());
  if(sortState.col>=0){
    rows.sort((a,b)=>{
      const x=a[sortState.col]||'',y=b[sortState.col]||'';
      const nx=parseFloat(x.replace(/[^0-9.\-]/g,'')),ny=parseFloat(y.replace(/[^0-9.\-]/g,''));
      if(!isNaN(nx)&&!isNaN(ny))return (nx-ny)*sortState.dir;
      return x.localeCompare(y,'zh')*sortState.dir;
    });
  }
  let h='<table><thead><tr>'+t.cols.map((c,i)=>'<th data-i="'+i+'">'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';
  if(rows.length===0){h+='</tbody></table>';}
  else{
    rows.forEach(r=>{
      h+='<tr>'+t.cols.map((c,i)=>{const v=r[i]||'';return '<td'+(/cost|spend|budget|consumption|ctr|rate|count|id|heat|wow|reuse/.test(c)?' class="num"':'')+'>'+esc(v)+'</td>';}).join('')+'</tr>';
    });
    h+='</tbody></table>';
  }
  document.getElementById('wrap').innerHTML=h;
  document.querySelectorAll('th').forEach(th=>{
    th.onclick=()=>{
      const i=+th.dataset.i;
      if(sortState.col===i)sortState.dir*=-1;else{sortState.col=i;sortState.dir=1;}
      render();
    };
  });
}
render();
</script>
</body>
</html>
