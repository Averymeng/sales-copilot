<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>精灵问答 · 觅客精灵</title>
<link rel="stylesheet" href="styles.css">
<style>
.qa-wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:calc(100vh - 140px); padding:40px 20px; text-align:center; }
.qa-ico { width:64px; height:64px; border-radius:18px; background:linear-gradient(135deg,var(--accent),var(--violet)); display:grid; place-items:center; font-size:28px; margin-bottom:20px; box-shadow:var(--sh-3); }
.qa-greet { font-size:26px; font-weight:700; letter-spacing:-.02em; margin-bottom:6px; }
.qa-greet em { font-style:normal; background:linear-gradient(120deg,var(--accent),var(--violet)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.qa-sub { font-size:14px; color:var(--text-2); max-width:420px; line-height:1.7; margin-bottom:32px; }
.qa-bar { display:flex; align-items:center; gap:10px; width:100%; max-width:560px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:6px 6px 6px 20px; box-shadow:var(--sh-1); transition:border-color .15s, box-shadow .15s; }
.qa-bar:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft), var(--sh-2); }
.qa-bar input { flex:1; border:none; background:none; outline:none; font:inherit; color:var(--ink); font-size:14px; min-width:0; }
.qa-bar button { width:42px; height:42px; border-radius:50%; border:none; background:linear-gradient(135deg,var(--accent),var(--violet)); color:#fff; font-size:17px; cursor:pointer; flex:none; display:grid; place-items:center; transition:transform .15s, opacity .15s; }
.qa-bar button:hover { transform:scale(1.06); opacity:.92; }
.qa-chips { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:24px; max-width:560px; }
.qa-chips .chip { font-size:13px; padding:8px 16px; }

/* chat panel (appears after first interaction) */
.qa-panel { display:none; width:100%; }
.qa-panel.show { display:block; }
.qa-panel .qa-messages { min-height:360px; max-height:520px; overflow-y:auto; padding:20px 0; display:flex; flex-direction:column; gap:12px; }
.qa-panel .qa-foot { border-top:1px solid var(--border); padding:14px 0 0; margin-top:16px; display:flex; gap:10px; }
.qa-panel .qa-foot input { flex:1; border:1px solid var(--border); border-radius:999px; padding:11px 18px; font:inherit; outline:none; color:var(--ink); }
.qa-panel .qa-foot input:focus { border-color:var(--accent); }
.qa-panel .qa-foot button { width:44px; height:44px; border-radius:50%; border:none; background:linear-gradient(135deg,var(--accent),var(--violet)); color:#fff; font-size:17px; cursor:pointer; flex:none; display:grid; place-items:center; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="mark"><svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="13.5" cy="13.5" r="7.5" stroke="#fff" stroke-width="2.4"/><line x1="18.6" y1="18.6" x2="24.5" y2="24.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M23.5 5.5l1.3 2.9 2.9 1.3-2.9 1.3-1.3 2.9-1.3-2.9-2.9-1.3 2.9-1.3z" fill="#fff"/></svg></div><div><div class="name">觅客精灵</div><div class="sub">Sales Copilot</div></div></div>
    <nav class="nav">
      <div class="group">工作台</div>
      <a href="dashboard.html"><span class="ico">◧</span>首页</a>
      <a href="leads.html"><span class="ico">✦</span>新客开拓</a>
      <a href="clients.html"><span class="ico">◉</span>我的客户</a>
      <div class="group">客户</div>
      <a href="account.html"><span class="ico">◉</span>客户档案</a>
      <a href="campaign.html"><span class="ico">◫</span>客户投放</a>
      <a href="proposals.html"><span class="ico">▤</span>提案与复盘</a>
      <div class="group">个人</div>
      <a href="tasks.html"><span class="ico">☑</span>待办 / 日程</a>
      <a href="knowledge.html"><span class="ico">❖</span>知识库</a>
      <a href="qa.html" class="active"><span class="ico">💬</span>精灵问答</a>
    </nav>
    <div class="side-foot"><div class="av">孟</div><div><div class="who">孟承泽</div><div class="role">KA 销售 · 教育行业</div></div></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div><h1>精灵问答</h1></div>
      <div class="search">🔍<input placeholder="Ask anything"></div>
    </header>

    <div class="content">
      <!-- Default: centered welcome -->
      <div class="qa-wrap" id="qaWelcome">
        <div class="qa-ico">🧚</div>
        <div class="qa-greet">Hey，我是 <em>觅客精灵</em></div>
        <div class="qa-sub">你的 AI 销售副驾。随时问我：查数据、出方案、做复盘、答客户疑问、监测行业动态——或者直接把客户的问题甩给我。</div>
        <div class="qa-bar">
          <input id="qaInputMain" placeholder="问点什么，或把客户的问题发给我…">
          <button id="qaSendMain">➤</button>
        </div>
        <div class="qa-chips" id="qaChips">
          <span class="chip">今天该重点跟谁？</span>
          <span class="chip">华图公考为什么掉量</span>
          <span class="chip">给新航道出个方案</span>
          <span class="chip">本周行业有什么新动向</span>
          <span class="chip">帮我写跟进话术</span>
        </div>
      </div>

      <!-- Chat panel (shows after first message) -->
      <div class="card qa-panel" id="qaPanel">
        <div class="qa-messages" id="qaBody"></div>
        <div class="qa-foot">
          <input id="qaInputChat" placeholder="继续问我…">
          <button id="qaSendChat">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
(function(){
  var welcome=document.getElementById('qaWelcome');
  var panel=document.getElementById('qaPanel');
  var body=document.getElementById('qaBody');
  var mainIn=document.getElementById('qaInputMain');
  var mainBtn=document.getElementById('qaSendMain');
  var chatIn=document.getElementById('qaInputChat');
  var chatBtn=document.getElementById('qaSendChat');
  var chips=document.getElementById('qaChips');

  function reply(){
    var ai=document.createElement('div'); ai.className='msg ai';
    ai.innerHTML='<div class="who">觅客精灵 · 副驾</div><div class="typing"><i></i><i></i><i></i></div>';
    body.appendChild(ai); body.scrollTop=body.scrollHeight;
    setTimeout(function(){
      ai.innerHTML='<div class="who">觅客精灵 · 副驾</div>已为你查询：当前「考研冲刺」赛道近 7 天消耗环比 +12.4%，留资成本升至 ¥96（赛道均值 ¥90），主因信息流按钮点击率下滑。建议把 15% 预算从信息流挪到搜索版位。';
      body.scrollTop=body.scrollHeight;
    }, 1000);
  }
  function go(text){
    text=(text||'').trim(); if(!text) return;
    // switch to chat mode
    welcome.style.display='none';
    panel.classList.add('show');
    // add user msg
    var me=document.createElement('div'); me.className='msg me'; me.textContent=text;
    body.appendChild(me);
    // clear inputs
    mainIn.value=''; chatIn.value='';
    body.scrollTop=body.scrollHeight;
    if(chips) chips.style.display='none';
    reply();
  }
  mainBtn.addEventListener('click',function(){go(mainIn.value);});
  mainIn.addEventListener('keydown',function(e){ if(e.key==='Enter') go(mainIn.value); });
  chatBtn.addEventListener('click',function(){go(chatIn.value);});
  chatIn.addEventListener('keydown',function(e){ if(e.key==='Enter') go(chatIn.value); });
  chips.querySelectorAll('.chip').forEach(function(c){ c.addEventListener('click',function(){ go(c.textContent); }); });
})();
</script>
</body>
</html>
